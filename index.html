<!DOCTYPE html>
<html lang="en" data-theme="dark">
<!--
  ============================================================
  AD MOCKUP SCREEN  (for TikTok ads / screenshots)
  ------------------------------------------------------------
  HOW TO EDIT
  1. Put your logo file (logo.png) in the SAME folder as this file.
  2. Change the text in the "EDIT HERE" spots below
     (service name, country, number, code).
  3. Switch colours:  <html data-theme="dark">  ->  data-theme="light"
  4. Open the page on your phone, or in Chrome press F12 then the
     phone icon (device mode), and take your screenshot.
  NOTE: no prices or balances are shown, on purpose.
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreign Numbers</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ---------- BRAND COLOURS (change these to restyle everything) ---------- */
    :root {
      --brand: #e50914;
      --brand-hover: #b80710;
      --brand-soft: rgba(229, 9, 20, 0.12);
      --ok: #22c55e;
      --ok-soft: rgba(34, 197, 94, 0.14);
      --bg: #0e0f12;
      --card: #16181d;
      --card-2: #1b1d23;
      --border: #262931;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    :root[data-theme="light"] {
      --brand-soft: rgba(229, 9, 20, 0.08);
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --bg: #f8fafc;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    html, body { background: var(--bg); color: var(--text); min-height: 100vh; }
    body { display: flex; justify-content: center; }

    /* soft red glow in the background */
    body::before {
      content: ""; position: fixed; top: -140px; right: -120px; width: 420px; height: 420px; pointer-events: none;
      background: radial-gradient(circle, rgba(229, 9, 20, 0.22) 0%, transparent 70%);
    }

    .app { width: 100%; max-width: 430px; min-height: 100vh; padding: 18px 20px 40px; position: relative; }

    /* ---------- top bar ---------- */
    .topbar { display: flex; align-items: center; gap: 14px; height: 72px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 14px; flex: 0 0 44px;
      background: var(--card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; color: var(--text);
    }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo { height: 44px; width: auto; max-width: 190px; object-fit: contain; display: block; }

    /* ---------- page heading ---------- */
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 14px 0 22px; }
    .head h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
    .head p { color: var(--muted); font-size: 0.95rem; font-weight: 500; margin-top: 6px; }
    .head .actions { display: flex; gap: 10px; }

    /* ---------- main card ---------- */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 26px;
      padding: 26px 22px 24px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; pointer-events: none;
      background: radial-gradient(circle, rgba(229, 9, 20, 0.16) 0%, transparent 70%);
    }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 99px;
      font-size: 0.92rem; font-weight: 700; background: var(--card-2); border: 1px solid var(--border);
    }
    .pill svg { width: 20px; height: 20px; flex: 0 0 20px; }
    .pill.done { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
    .pill.done .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }

    .country { text-align: center; color: var(--muted); font-size: 1rem; font-weight: 600; margin-top: 28px; position: relative; }

    .number-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; position: relative; }
    .number { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.01em; }
    .copy {
      width: 44px; height: 44px; border-radius: 14px; flex: 0 0 44px; cursor: pointer;
      background: var(--card-2); border: 1px solid var(--border); color: var(--text);
      display: flex; align-items: center; justify-content: center; transition: .2s;
    }
    .copy:hover { border-color: var(--brand); color: var(--brand); }
    .copy.copied { border-color: var(--ok); color: var(--ok); }
    .copy svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .divider { height: 1px; background: var(--border); margin: 26px 0 24px; position: relative; }

    .code-label { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 1rem; font-weight: 600; position: relative; }
    .code-label svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .code { text-align: center; font-size: 3.2rem; font-weight: 800; letter-spacing: 0.14em; color: var(--brand); margin: 14px 0 26px; padding-left: 0.14em; position: relative; }

    .buttons { display: flex; gap: 12px; position: relative; }
    .btn {
      flex: 1; border-radius: 14px; padding: 16px 10px; font-size: 1rem; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: .2s; text-decoration: none;
    }
    .btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.ghost:hover { border-color: var(--brand); color: var(--brand); }
    .btn.solid { background: var(--brand); border: 1px solid var(--brand); color: #fff; box-shadow: 0 8px 22px rgba(229, 9, 20, 0.35); }
    .btn.solid:hover { background: var(--brand-hover); }

    @media (max-width: 380px) {
      .number { font-size: 1.55rem; }
      .code { font-size: 2.7rem; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <div class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </div>
      <!-- YOUR LOGO: put logo.png next to this file -->
      <img class="logo" src="logo.jpg" alt="" onerror="this.style.display='none'">
    </header>

    <!-- ===== PAGE HEADING ===== -->
    <section class="head">
      <div>
        <h1>Foreign Numbers</h1>                       <!-- EDIT HERE -->
        <p>Verification code received.</p>             <!-- EDIT HERE -->
      </div>
      <div class="actions">
        <div class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
        </div>
        <div class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        </div>
      </div>
    </section>

    <!-- ===== MAIN CARD ===== -->
    <main class="card">

      <div class="row">
        <!-- SERVICE (EDIT the name; swap the icon if you like) -->
        <span class="pill">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877f2"/><path d="M13.3 20v-6.6h2.2l.4-2.6h-2.6V9.2c0-.8.3-1.3 1.4-1.3h1.3V5.6c-.2 0-1-.1-1.9-.1-2 0-3.3 1.2-3.3 3.4v1.9H8.6v2.6h2.2V20z" fill="#fff"/></svg>
          Facebook
        </span>
        <span class="pill done"><span class="dot"></span>Completed</span>
      </div>

      <!-- COUNTRY (EDIT HERE) -->
      <div class="country">United States</div>

      <!-- NUMBER (EDIT HERE) -->
      <div class="number-row">
        <div class="number" id="num">+12025550143</div>
        <button class="copy" id="copyBtn" type="button" aria-label="Copy number">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <div class="code-label">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        Verification code received
      </div>

      <!-- CODE (EDIT HERE) -->
      <div class="code">482916</div>

      <div class="buttons">
        <a class="btn ghost" href="#">View in history</a>
        <a class="btn solid" href="#">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>
          Rent another
        </a>
      </div>

    </main>
  </div>

  <script>
    // Copy button (works when you tap it)
    document.getElementById('copyBtn').addEventListener('click', function () {
      var btn = this, txt = document.getElementById('num').textContent;
      try { navigator.clipboard.writeText(txt); } catch (e) {}
      btn.classList.add('copied');
      setTimeout(function () { btn.classList.remove('copied'); }, 1200);
    });
  </script>
</body>
</html>
